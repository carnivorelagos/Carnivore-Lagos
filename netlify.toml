[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Route Handlers become Netlify Functions via the plugin above. Keep every
# handler well inside Netlify's function execution time budget (verify the
# current limit against Netlify's docs at deploy time, per Section 29) —
# the webhook and verify handlers in particular do a small, fixed number
# of DB/Paystack calls and no long-running work, by design.

# Standalone functions (not generated by the Next plugin) live here. The
# only one is the scheduled payment reconciler, which every ~10 min calls
# POST /api/internal/reconcile-payments with the RECONCILE_SECRET bearer
# token. See netlify/functions/reconcile-payments.mts.
[functions]
  directory = "netlify/functions"
